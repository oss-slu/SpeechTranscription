name: Build SpeechTranscription (Windows)

on:
  workflow_call:
  push:
    branches:
      - main
      - fix-exe
      - testingv4artifact
      - issue169_dependency
      - issue178_build-test-failures
      - issue-2-cicd-logging
      - feature/windowsBuild
      - feature/addMorphemesError
      - excellenceGUI
      - nltkDownloads
      - feature/remove-java-prerequisite_windows
      - fix/salt-submit-annotation
      - feature/macos-bundle-deps
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v4
        with:
          python-version: 3.11.7

      - uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          # setuptools>=82 removed pkg_resources.NullProvider and breaks PyInstaller boot
          python -m pip install "setuptools>=70,<81" "pyinstaller>=6.11,<7"
          python -m pip install -r requirements.txt importlib-metadata sacremoses tokenizers
          python -m pip install mysql-connector-python pyaudio

      # The packaged app never downloads NLTK data, so it must be bundled
      - name: Download NLTK data for bundling
        run: python scripts/bundle_nltk_data.py nltk_data

      - name: Initialize Git submodules
        run: git submodule update --init --recursive

      - name: Remove obsolete typing package
        run: pip uninstall -y typing || echo "typing not installed"

      - name: Download Temurin JDK 17
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/adoptium/temurin17-binaries/releases/download/jdk-17.0.12+7/OpenJDK17U-jdk_x64_windows_hotspot_17.0.12_7.zip" -OutFile "temurin17.zip"
          Expand-Archive -Path "temurin17.zip" -DestinationPath "."
          $jdkFolder = Get-ChildItem -Directory | Where-Object { $_.Name -like "jdk-17*" } | Select-Object -First 1
          Rename-Item -Path $jdkFolder.FullName -NewName "jre"


      - name: Build Windows EXE
        shell: cmd
        run: |
          pyinstaller --name Saltify ^
          --windowed ^
          --noconfirm ^
          --onefile ^
          --add-data "images;images" ^
          --add-data "build_assets\\en-model.slp;pattern/text/en" ^
          --add-data "CTkXYFrame;CTkXYFrame" ^
          --add-data "nltk_data;nltk_data" ^
          --add-data "jre;jre" ^
          --collect-data language_tool_python ^
          --copy-metadata language_tool_python ^
          --collect-data whisper ^
          --collect-data lightning_fabric ^
          --collect-data pytorch_lightning ^
          --collect-data pyannote.audio ^
          --copy-metadata torch ^
          --copy-metadata pyannote.audio ^
          --copy-metadata tqdm ^
          --copy-metadata regex ^
          --copy-metadata sacremoses ^
          --copy-metadata requests ^
          --copy-metadata packaging ^
          --copy-metadata filelock ^
          --copy-metadata numpy ^
          --copy-metadata tokenizers ^
          --copy-metadata importlib_metadata ^
          --collect-data sv_ttk ^
          --hidden-import "lightning_fabric" ^
          --hidden-import "torch" ^
          --hidden-import "torchvision" ^
          --hidden-import "pytorch_lightning" ^
          --hidden-import "pyannote.audio" ^
          GUI.py

      # SBOM: --onefile hides dependencies inside Saltify.exe, so scan the
      # Python environment PyInstaller bundled from (OSS-SLU baseline §4, fallback #2).
      - name: Generate Windows SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ${{ env.pythonLocation }}
          format: spdx-json
          output-file: Saltify_windows-sbom.spdx.json
          upload-artifact: false

      - name: Upload Windows SBOM
        uses: actions/upload-artifact@v4
        with:
          name: Saltify_windows-sbom
          path: Saltify_windows-sbom.spdx.json
          if-no-files-found: error
      # Launch the packaged exe in self-test mode without the runner's Java, so
      # it can only pass using what is bundled inside it. The exe is windowed
      # (no console), so results come back through the report file.
      - name: Smoke test packaged app
        shell: pwsh
        timeout-minutes: 15
        env:
          HEADLESS: "true"
          SALTIFY_SELFTEST_REPORT: ${{ github.workspace }}\selftest-report.txt
        run: |
          $report = $env:SALTIFY_SELFTEST_REPORT
          Remove-Item $report -ErrorAction SilentlyContinue
          Remove-Item Env:JAVA_HOME -ErrorAction SilentlyContinue
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -notmatch '(?i)java|jdk|jre' }) -join ';'
          $p = Start-Process -FilePath "dist\Saltify.exe" -Wait -PassThru
          $exitCode = $p.ExitCode
          if (-not (Test-Path $report)) {
            "RESULT: FAIL (app exited with $($p.ExitCode) before writing a report)" | Set-Content $report
            $exitCode = 1
          }
          Add-Content $env:GITHUB_STEP_SUMMARY "### Windows packaged app self-test (exit code $exitCode)"
          Add-Content $env:GITHUB_STEP_SUMMARY '```'
          Get-Content $report | Add-Content $env:GITHUB_STEP_SUMMARY
          Add-Content $env:GITHUB_STEP_SUMMARY '```'
          Get-Content $report
          exit $exitCode

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SpeechTranscription_windows_selftest
          path: selftest-report.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SpeechTranscription_windows
          path: dist/Saltify.exe
